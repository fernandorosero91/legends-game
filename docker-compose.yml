version: "3.8"

services:
  legends-game:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_INSFORGE_URL=${VITE_INSFORGE_URL}
        - VITE_INSFORGE_ANON_KEY=${VITE_INSFORGE_ANON_KEY}
    restart: unless-stopped
    ports:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.legends-game.loadbalancer.server.port=80"
